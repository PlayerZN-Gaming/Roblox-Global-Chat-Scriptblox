<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Chat Link Maker</title>
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0d0d0d; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 350px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; outline: none; font-size: 16px; }
    button { width: 100%; padding: 12px; margin-top: 15px; background: #4c6ef5; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #3b5bdb; }
    .output { margin-top: 20px; padding: 15px; background: #111; border-radius: 10px; word-break: break-all; }
    .label { margin-top: 15px; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Custom Link Maker</h2>
    <input id="inputText" placeholder="Enter Custom Link" />
    <button onclick="generateLinks()">Generate Links</button>

    <div class="label">Generated:</div>
    <div id="output" class="output">Your links will appear here.</div>
  </div>

  <script>
    function generateLinks() {
      const text = document.getElementById('inputText').value;
      if (!text.trim()) {
        document.getElementById('output').innerText = "Please enter text.";
        return;
      }

      const formatted = text.trim().toLowerCase().replace(/\s+/g, '-');

      const base = "https://your-vercel-app.vercel.app/";
      const send = base + formatted + "/api/send";
      const messages = base + formatted + "/api/messages";

      document.getElementById('output').innerHTML =
        `<b>Send API:</b><br>${send}<br><br><b>Messages API:</b><br>${messages}`;
    }
  </script>
</body>
</html>
